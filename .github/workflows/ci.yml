name: CI

# Hardware-free regression suite and one complete AGRV2K uarch build. Runs on every
# push and pull request.
#
# This gates the parts of AGaMEMnon that need neither a board nor the external
# FPGA toolchain (Yosys/nextpnr): the bitstream codec, the strict packer, the
# programming-protocol/safety logic, and -- importantly -- the SERV evidence
# gate (tests/test_serv_evidence_gate.py), which re-packs the shipped routed
# artifacts through strict bitgen so a stale or unpackable qualification artifact
# can never silently ship again. The uarch job separately gates the complete
# Verilog -> Yosys -> nextpnr -> strict-bitgen path on a small, proven design;
# large SERV placement remains covered by its retained routed-artifact gate.
#
# The Python matrix intentionally lacks Yosys/nextpnr, so its tool-dependent
# tests skip. The uarch-build job below supplies the pinned tools and gates the
# complete Verilog -> Yosys -> AGRV2K nextpnr -> strict bitgen path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[programming]" pytest

      - name: Diagnostics (host path, no hardware)
        # informational only: Yosys/nextpnr are intentionally absent in CI, so
        # doctor reports "not ready" and exits non-zero -- don't fail the build.
        run: agamemnon doctor --no-hardware || true

      - name: Reject machine-specific path leaks
        run: python tools/check_path_leaks.py

      - name: Validate maintained documentation links and anchors
        run: python tools/check_docs.py

      - name: Validate append-only qualification evidence
        run: python tools/validate_evidence.py

      - name: Run hardware-free test suite
        run: pytest -q

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up oldest CI Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Build wheel from the clean checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Install and exercise only the wheel
        run: |
          python -m venv "$RUNNER_TEMP/agamemnon-wheel"
          "$RUNNER_TEMP/agamemnon-wheel/bin/python" -m pip install wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agamemnon-wheel/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_wheel_smoke.py" \
            "$GITHUB_WORKSPACE"/wheelhouse/*.whl \
            "$GITHUB_WORKSPACE/tests/fixtures/counter_ahb_routed.json"

  installed-wheel-macos:
    name: Installed wheel (native macOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up oldest supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Build wheel from the clean checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Install and exercise only the wheel
        run: |
          python -m venv "$RUNNER_TEMP/agamemnon-wheel"
          "$RUNNER_TEMP/agamemnon-wheel/bin/python" -m pip install wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agamemnon-wheel/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_wheel_smoke.py" \
            "$GITHUB_WORKSPACE"/wheelhouse/*.whl \
            "$GITHUB_WORKSPACE/tests/fixtures/counter_ahb_routed.json"

  uarch-build:
    name: AGRV2K end-to-end build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AGaMEMnon and native nextpnr dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libboost-all-dev libeigen3-dev
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Cache pinned FPGA tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/agamemnon/downloads
            .cache/nextpnr
          key: serv-tools-${{ runner.os }}-${{ hashFiles('tools/bundle/manifest.json', 'tools/bundle/fetch_tools.py', 'agamemnon/engine/uarch/agrv2k/build.sh', 'agamemnon/engine/uarch/agrv2k/agrv2k.cc') }}

      - name: Fetch hash-pinned Yosys
        id: oss
        run: |
          python tools/bundle/fetch_tools.py \
            --platform linux-x64 \
            --component oss_cad_suite \
            --output "$RUNNER_TEMP/serv-tools" \
            --cache "$HOME/.cache/agamemnon/downloads" \
            --json-output "$RUNNER_TEMP/serv-tools.json"
          echo "root=$(python -c 'import json,os; tmp=os.environ["RUNNER_TEMP"]; rel=json.load(open(tmp + "/serv-tools.json"))["oss"]; print(os.path.join(tmp, "serv-tools", rel))')" >> "$GITHUB_OUTPUT"

      - name: Build pinned AGRV2K nextpnr
        env:
          NEXTPNR: ${{ github.workspace }}/.cache/nextpnr
          JOBS: "2"
        run: |
          agamemnon/engine/uarch/agrv2k/build.sh

      - name: Build and verify proven combinational IO through the public flow
        env:
          AGAMEMNON_OSS: ${{ steps.oss.outputs.root }}
          AGAMEMNON_UARCH_NEXTPNR: ${{ github.workspace }}/.cache/nextpnr/build/nextpnr-generic
        run: |
          mkdir -p .tmp/ci-uarch
          agamemnon build examples/designs/and2.v --uarch \
            --pcf examples/constraints/and2_proven_L48.pcf --verify \
            --write-routed .tmp/ci-uarch/and2_routed.json \
            -o .tmp/ci-uarch/and2.bin \
            2>&1 | tee .tmp/ci-uarch/build.log
          test "$(stat -c %s .tmp/ci-uarch/and2.bin)" -eq 99944
          test -s .tmp/ci-uarch/and2.bin.comp
          test -s .tmp/ci-uarch/and2_routed.json
          grep -q "0 unmapped" .tmp/ci-uarch/build.log

      - name: Upload uarch build evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uarch-build-failure
          if-no-files-found: ignore
          path: .tmp/ci-uarch/

  windows-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[programming]" pytest

      - name: Reject machine-specific path leaks
        run: python tools/check_path_leaks.py

      - name: Diagnostics (Windows host path, no hardware)
        run: agamemnon doctor --no-hardware
        continue-on-error: true

      - name: Run hardware-free test suite on Windows
        run: pytest -q
