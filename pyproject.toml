[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agamemnon-ag32"
version = "0.1.0"
description = "Open SDK, FPGA toolchain, and English documentation for the AGM AG32 RISC-V MCU with embedded AGRV2K fabric"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
license = { text = "MIT" }
authors = [{ name = "Brian Benchoff" }]
keywords = ["AG32", "AGM", "AGRV2K", "FPGA", "MCU", "bitstream", "reverse-engineering", "nextpnr", "Yosys", "RISC-V"]

[project.optional-dependencies]
examples = ["pyserial>=3.5"]
programming = ["pyserial>=3.5"]
sdk = ["pyserial>=3.5", "platformio>=6.1,<7"]

[project.urls]
Homepage = "https://github.com/bbenchoff/AGaMEMnon"
Documentation = "https://github.com/bbenchoff/AGaMEMnon/blob/main/docs/AG32_OVERVIEW.md"
Issues = "https://github.com/bbenchoff/AGaMEMnon/issues"
Changelog = "https://github.com/bbenchoff/AGaMEMnon/blob/main/CHANGELOG.md"

[project.scripts]
agamemnon = "agamemnon.cli:main"

[tool.setuptools]
packages = ["agamemnon", "agamemnon.engine"]
include-package-data = false

[tool.setuptools.package-data]
# Ship the self-contained runtime database, decoded architecture template,
# synthesis scripts, board SDK, and project templates.
agamemnon = ["archdec_cfg/*.csv", "chipdb/*", "chipdb/**/*", "synth/*", "openocd/*", "sdk/*", "sdk/**/*", "templates/*", "templates/**/*"]
"agamemnon.engine" = ["mesh_resolver_table.json", "pips_bram_pll.csv", "uarch/agrv2k/README.md", "uarch/agrv2k/agrv2k.cc", "uarch/agrv2k/build.sh"]

[tool.setuptools.exclude-package-data]
# These large tables support opt-in research switches, not the release flow.
# They remain available in a Git LFS source checkout via AGAMEMNON_DATA.
agamemnon = ["chipdb/pip_usage.csv", "chipdb/rrg_rmux_imux_full.csv"]

[tool.pytest.ini_options]
# only our tests; never descend into a local nextpnr checkout (gitignored, but present on dev machines
# — its googletest/pybind11 test scripts otherwise break bare `pytest` collection).
testpaths = ["tests"]
norecursedirs = ["third_party", "*.egg", ".git", "build"]
