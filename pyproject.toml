[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agamemnon-ag32"
version = "0.4.0"
description = "Open SDK, FPGA toolchain, and English documentation for the AGM AG32 RISC-V MCU with embedded AGRV2K fabric"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
license = { text = "MIT" }
authors = [{ name = "Brian Benchoff" }]
keywords = ["AG32", "AGM", "AGRV2K", "FPGA", "MCU", "bitstream", "reverse-engineering", "nextpnr", "Yosys", "RISC-V"]

[project.optional-dependencies]
examples = ["pyserial>=3.5"]
programming = ["pyserial>=3.5"]
sdk = ["pyserial>=3.5", "platformio>=6.1,<7"]

[project.urls]
Homepage = "https://github.com/bbenchoff/AGaMEMnon"
Documentation = "https://github.com/bbenchoff/AGaMEMnon/blob/main/docs/AG32_OVERVIEW.md"
Issues = "https://github.com/bbenchoff/AGaMEMnon/issues"
Changelog = "https://github.com/bbenchoff/AGaMEMnon/blob/main/CHANGELOG.md"

[project.scripts]
agamemnon = "agamemnon.cli:main"

[tool.setuptools]
packages = [
  "agamemnon",
  "agamemnon.engine",
  "agamemnon.engine.features",
  "agamemnon.sim",
]
include-package-data = false

[tool.setuptools.package-data]
# Ship the self-contained runtime database, decoded architecture template,
# synthesis scripts, board SDK, and project templates. Keep the chipdb
# allow-list structural. The recovered-knowledge profile is explicit and
# non-release, but its normalized topology must remain self-contained.
agamemnon = [
  "archdec_cfg/*.csv",
  "rtl/*.v",
  "chipdb/*.bin",
  "chipdb/*.json",
  "chipdb/*.agdb",
  "chipdb/[abcdefhilmsw]*.csv",
  "chipdb/pad*.csv",
  "chipdb/physical_*.csv",
  "chipdb/pips_*.csv",
  "chipdb/rrg_edges_full.csv",
  "chipdb/rrg_omux_imux_full.csv",
  "chipdb/route_through_footprints.csv",
  "synth/*",
  "openocd/*",
  "sdk/*",
  "sdk/**/*",
  "templates/*",
  "templates/**/*",
]
"agamemnon.engine" = [
  "mesh_resolver_table.json", "pips_bram_pll.csv", "status_overlay_dev_*.csv.gz",
  "status_overlay_devdb_manifest.json", "uarch/agrv2k/README.md",
  "uarch/agrv2k/agrv2k.cc", "uarch/agrv2k/build.sh", "uarch/agrv2k/*.patch",
  "uarch/agrv2k/router2_probe_uarch/*.cc", "uarch/agrv2k/router2_probe_uarch/*.inc",
  "uarch/agrv2k/router2_probe_uarch/*.json",
]
"agamemnon.sim" = ["*.v"]

[tool.pytest.ini_options]
# only our tests; never descend into a local nextpnr checkout (gitignored, but present on dev machines
# — its googletest/pybind11 test scripts otherwise break bare `pytest` collection).
testpaths = ["tests"]
norecursedirs = ["third_party", "*.egg", ".git", "build"]
