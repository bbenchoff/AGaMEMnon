[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agamemnon-ag32"
version = "0.1.0"
description = "Open toolchain for the AGM AG32 / AGRV2K: FPGA bitstream build (Yosys/nextpnr/bitgen) and open flashing/programming"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
license = { text = "MIT" }
authors = [{ name = "Brian Benchoff" }]
keywords = ["AG32", "AGRV2K", "FPGA", "bitstream", "reverse-engineering", "nextpnr", "RISC-V"]

[project.optional-dependencies]
examples = ["pyserial>=3.5"]
programming = ["pyserial>=3.5"]
sdk = ["pyserial>=3.5", "platformio>=6.1,<7"]

[project.urls]
Homepage = "https://github.com/bbenchoff/AGaMEMnon"

[project.scripts]
agamemnon = "agamemnon.cli:main"

[tool.setuptools]
packages = ["agamemnon", "agamemnon.engine"]

[tool.setuptools.package-data]
# ship the self-contained device database + synth scripts so the repo is clone-and-use
agamemnon = ["chipdb/*", "chipdb/**/*", "synth/*", "openocd/*", "sdk/*", "sdk/**/*", "templates/*", "templates/**/*"]
"agamemnon.engine" = ["*.py", "uarch/agrv2k/*"]

[tool.pytest.ini_options]
# only our tests; never descend into a local nextpnr checkout (gitignored, but present on dev machines
# — its googletest/pybind11 test scripts otherwise break bare `pytest` collection).
testpaths = ["tests"]
norecursedirs = ["third_party", "*.egg", ".git", "build"]
