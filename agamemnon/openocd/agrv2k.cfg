# Open OpenOCD config for the AGM AG32 / AGRV2K debug transport.
#
# No vendor OpenOCD build, no vendor "Supra" config, no 'agrv' flash driver: this is stock OpenOCD.
# The AGRV2K exposes its RISC-V debug module behind an ARM ADIv5 DAP (the DM registers are AP0
# registers), so it needs an OpenOCD built with RISC-V-over-ADIv5-DAP support (`target create riscv
# -dap ...`). That support is open (see github.com/riscv-collab/riscv-openocd) but is NOT in every
# prebuilt OpenOCD -- notably the oss-cad-suite build lacks it. Verified working: this cfg reads the
# core (XLEN=32, misa=0x40801125) and DEVICE_ID 0x40200001 with no vendor pieces.
#
# Transport: a CMSIS-DAP probe (the AGM DAP-Link "USB Blaster" is one) over SWD.
# Usage:  openocd -f agrv2k.cfg -c "halt" -c "mdw 0x03000100" -c "shutdown"

adapter driver cmsis-dap
transport select swd
adapter speed 2000

source [find target/swj-dp.tcl]

set _CHIPNAME agrv2k
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.cpu riscv -endian little -dap $_CHIPNAME.dap
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x10000
riscv set_mem_access sysbus progbuf

init
