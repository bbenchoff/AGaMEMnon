# Exact self-contained AG32/AGRV2K Phase1C live-readiness configuration.
# No external scripts search path or Tcl file-loading command is admitted.

adapter driver cmsis-dap
transport select swd
adapter speed 2000

set _CHIPNAME agrv2k
swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.cpu riscv -endian little -dap $_CHIPNAME.dap
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x10000
riscv set_mem_access sysbus progbuf

init
